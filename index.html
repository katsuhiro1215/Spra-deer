<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#234b3a" />
  <meta name="description" content="鹿のうんこをよけて、ゴールへ。…その道、ほんとうに安全？ Spruと鹿。奈良公園が舞台の縦画面ゲーム。" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Spruと鹿。｜足元には、ご用心。</title>
</head>
<body>
  <main id="shell">
    <aside class="side-note">
      <div class="brand"><span class="brand-mark">S</span> spra <span class="brand-dot"></span></div>
      <p class="eyebrow">奈良の、小さなしかけ話。</p>
      <h1>その道、<br>ほんとうに<br><em>安全？</em></h1>
      <p>鹿のうんこを、ひょいとよける。<br>ほっとしたら、足元がミシッ。<br>Spruの散歩は、一筋縄じゃいかない。</p>
      <div class="keyboard-guide"><span><kbd>W A S D</kbd> / <kbd>↑ ↓ ← →</kbd> 移動</span><span><kbd>Space</kbd> ジャンプ　<kbd>R</kbd> 再挑戦</span></div>
      <p class="edition">Spruと鹿。</p>
    </aside>
    <section id="game-wrap" aria-label="Spruと鹿。ゲーム画面">
      <div id="game" tabindex="0" aria-label="ゲーム画面。方向キーで移動、スペースでジャンプ"></div>
      <div class="shade"></div>
      <header id="hud" hidden>
        <div class="hud-heading"><div><span class="eyebrow" id="hud-level">面 1-1</span><h2 id="hud-title">足元には、ご用心。</h2></div><button id="pause" class="round-button" aria-label="一時停止">Ⅱ</button></div>
        <div class="hud-stats"><div><span class="stat-label">タイム</span><b id="timer">0.0<small>秒</small></b></div><div class="best-stat"><span class="stat-label">自己ベスト</span><b id="best">—</b></div></div>
        <div class="progress" role="progressbar" aria-label="ゴールまでの進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progress"></i></div>
      </header>
      <div id="message" role="status" aria-live="polite"></div>
      <div id="controls" hidden>
        <div class="control-row">
          <div class="move-control"><div id="move-pad" aria-label="ドラッグして移動" role="group"><span class="pad-up">↑</span><span class="pad-down">↓</span><span class="pad-left">←</span><span class="pad-right">→</span><div id="move-stick"></div></div><span>ドラッグで移動</span></div>
          <div class="control-note">指を離すと<br>ピタッと止まる</div>
          <button id="jump" aria-label="ジャンプ"><svg viewBox="0 0 60 44" aria-hidden="true"><path d="M6 34C15 6 43 6 54 34"/><path d="M45 31L54 34L55 24"/><path d="M5 40H17M43 40H55"/></svg><strong>ジャンプ</strong><span id="jump-hint">Space</span></button>
        </div>
      </div>
      <div id="overlay">
        <div class="screen loading"><p>奈良さんぽの、準備中…</p></div>
      </div>
      <div id="fatal" hidden><h2>読み込みできませんでした</h2><p>ページを再読み込みしてください。</p><button id="reload">再読み込み</button></div>
    </section>
    <aside class="chapter-note"><span>STAGE 1</span><div class="trail-decoration"><i></i><i></i><i></i></div><p>鹿に、悪気はありません。<br>地面は、どうでしょう。</p></aside>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
